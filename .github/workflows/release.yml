name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            artifact: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Renamiq_*.dmg
            outname: Renamiq-$V-macos-arm64.dmg
            apple_signing_identity: "-"
          - platform: ubuntu-22.04
            args: --bundles appimage
            artifact: src-tauri/target/release/bundle/appimage/Renamiq_*.AppImage
            outname: Renamiq-$V-linux-x64.AppImage
          - platform: windows-latest
            args: --bundles nsis
            artifact: src-tauri/target/release/bundle/nsis/Renamiq_*-setup.exe
            outname: Renamiq-$V-windows-x64.exe

    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies (linux)
        if: matrix.settings.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.settings.apple_signing_identity }}
        run: pnpm tauri build ${{ matrix.settings.args }}

      - name: Rename artifact
        shell: bash
        env:
          SRC: ${{ matrix.settings.artifact }}
          OUT: ${{ matrix.settings.outname }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-artifacts
          cp $SRC "release-artifacts/${OUT//'$V'/$version}"

      - uses: softprops/action-gh-release@v3
        with:
          name: Renamiq ${{ github.ref_name }}
          files: release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
